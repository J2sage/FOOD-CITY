<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin_login</title>
  <link rel="stylesheet" href="admin_login.css">
  <link rel="shortcut icon" href="Main_page/icons/foodcityng_logo.jpg" sizes="532x32" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="form-container login-form-wrapper">
    <form id="login-form" action="">
      <h2>Login</h2>
      <div class="input-box">
        <span class="icon"><ion-icon name="mail"></ion-icon></span>
        <input id="login-email" name="email" class="username" type="email" autocomplete="email" placeholder=" " required>
        <label for="login-email">Email</label>
      </div>
      <div class="input-box">
        <span class="icon"><ion-icon name="lock"></ion-icon></span>
        <input id="login-password" name="password" type="password" class="password" autocomplete="current-password" placeholder=" " required>
        <label for="login-password">Password</label>
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
  </div>
  <script type="module" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.js"></script>
  <script type="module" src="admin_login.js"></script>
</body>
</html>
