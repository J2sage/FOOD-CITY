<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Items - Food City</title>
  <link rel="shortcut icon" href="../../Main_page/icons/foodcityng_logo.jpg" sizes="532x32" type="image/x-icon">
  <link rel="stylesheet" href="menu.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="admin-header-container">
    <div class="admin-header">
      <div class="left">
        <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
          <ion-icon name="menu"></ion-icon>
        </button>
        <div>
          <h1>Menu Items</h1>
          <p>Manage all menu items in your restaurant.</p>
        </div>
      </div>
      <div class="right">
        <button class="secondary-btn">Export</button>
        <button class="add-item-btn">+ Add Item</button>
      </div>
    </div>
  </header>

  <main>
    <nav class="side-bar" id="sidebar">
      <button class="sidebar-close" type="button" aria-label="Close sidebar">
        <ion-icon name="close"></ion-icon>
      </button>
      <a href="../../index.html"><img src="../../Main_page/assets/foodcity-logo.png" alt="Food City Logo" class="logo"></a>
      <ul>
        <li><a href="admin.html"><ion-icon name="pie"></ion-icon><span>Dashboard</span></a></li>
        <li><a href="menu.html" class="active"><ion-icon name="restaurant"></ion-icon><span>Menu Items</span></a></li>
        <li><a href="customer.html"><ion-icon name="people"></ion-icon><span>Customers</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-overlay"></div>
    <div class="popup-overlay"></div>

    <section class="main-container">
      <section class="page-top">
        <div class="page-title">
          <h1>Menu Items</h1>
          <p>Manage menu items in your restaurant.</p>
        </div>
        <div class="page-actions">
          <div class="search-group" >
            <input type="text" id="search-input" placeholder="Search menu items..." aria-label="Search menu items">
          </div>
          <div class="filter-group">
            <select id="selectedCategory" aria-label="Filter by category">
              <option value="all">All Categories</option>
              <option value="rice">Rice</option>
              <option value="yam">Yam</option>
              <option value="drinks">Drinks</option>
              <option value="noodles">Noodles</option>
            </select>
            <button class="secondary-btn">Filter</button>
          </div>
        </div>
      </section>

      <section class="order-section">
        <div class="order-table menu-table">
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody class="js-item-body">
              
            </tbody>
          </table>
        </div>
      </section>

      <section class="add-item-container" id="add-item-container" >
        <p>Add New Menu Item</p>
        <ion-icon name="close-circle" class="close-popup"></ion-icon>
        <form action="" class="popup">
          <div class="popup-input">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter Item name">
          </div>
          <div class="popup-input">
            <label for="price">Price</label>
            <input type="number" id="price" placeholder="Enter price">
          </div>
          <div class="popup-input">
            <label for="category">Category</label>
            <input type="text" id="category" placeholder="Category">
          </div>
          <div class="popup-input">
            <input type="file" id="image-upload" accept="image/*" class="hidden-input" />
            <label for="image-upload" class="custom-upload-btn">
              <span>Click to upload image</span>
            </label>
          </div>
          <div class="js-action">
            <button type="reset" class="cancel-btn">Cancel</button>
            <button type="submit" class="submit-btn">Submit</button>
          </div>
        </form>
      </section>

    </section>

  </main>

  <script src="admin-sidebar.js" defer></script>
  <script src="script/admin_menu.js" type="module" defer></script>
  <script type="module" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.js"></script>
</body>
</html>
