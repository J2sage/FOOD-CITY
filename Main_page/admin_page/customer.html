<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers - Food City</title>
  <link rel="shortcut icon" href="../../Main_page/icons/foodcityng_logo.jpg" sizes="532x32" type="image/x-icon">
  <link rel="stylesheet" href="customer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="admin-header-container">
    <div class="admin-header">
      <div class="left">
        <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
          <ion-icon name="menu"></ion-icon>
        </button>
        <div>
          <h1>Customers</h1>
          <p>View and manage your customers.</p>
        </div>
      </div>
      <div class="right">
        <button class="add-item-btn">
          <ion-icon name="sync"></ion-icon>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main>
    <nav class="side-bar" id="sidebar">
      <button class="sidebar-close" type="button" aria-label="Close sidebar">
        <ion-icon name="close"></ion-icon>
      </button>
      <a href="../../index.html"><img src="../../Main_page/assets/foodcity-logo.png" alt="Food City Logo" class="logo"></a>
      <ul>
        <li><a href="admin.html"><ion-icon name="pie"></ion-icon><span>Dashboard</span></a></li>
        <li><a href="menu.html"><ion-icon name="restaurant"></ion-icon><span>Menu Items</span></a></li>
        <li><a href="customer.html" class="active"><ion-icon name="people"></ion-icon><span>Customers</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-overlay"></div>

    <section class="main-container">
      <section class="page-top">
        <div class="page-title">
          <h1>Customers</h1>
          <p>View and manage your customers.</p>
        </div>
        <div class="page-actions">
          <div class="search-group">
            <input type="text" id="search-input" placeholder="Search customers..." aria-label="Search customers">
          </div>
          <div class="filter-group">
            <select aria-label="Filter by status" id="selected-status">
              <option value="all">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
            <button class="secondary-btn">Filter</button>
          </div>
        </div>
      </section>

      <section class="order-section">
        <div class="order-table menu-table">
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Username</th>
                <th>Phone</th>
                <th>Total Orders</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody class="js-customer-body">
              
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop" id="delete-customer-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="delete-customer-title">
    <div class="confirm-modal">
      <button type="button" class="modal-close js-cancel-delete" aria-label="Close confirmation dialog"><ion-icon name="close"></ion-icon></button>
      <div class="modal-icon"><ion-icon name="trash"></ion-icon></div>
      <h2 id="delete-customer-title">Delete customer account?</h2>
      <p>This will permanently delete <strong class="js-delete-customer-name"></strong>. This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="modal-cancel js-cancel-delete">No, keep account</button>
        <button type="button" class="modal-confirm js-confirm-delete">Yes, delete</button>
      </div>
    </div>
  </div>

  <script src="admin-sidebar.js" defer></script>
  <script src="script/admin_customer.js" type="module" defer></script>
  <script type="module" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule="" src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.js"></script>
</body>
</html>
